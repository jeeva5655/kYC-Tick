services:
  - type: web
    name: kyc-tick-vision-service
    env: python
    buildCommand: "pip install uv && uv pip install --system -r pyproject.toml"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
    rootDir: vision_service
