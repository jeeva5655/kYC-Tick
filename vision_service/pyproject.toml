[project]
name = "synthetic-document-vision-service"
version = "0.1.0"
description = "Local OCR and image-forensics adapters for the synthetic document-integrity demo."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "cryptography>=50.0.1",
  "deepface>=0.0.100",
  "easyocr>=1.7.2",
  "fastapi>=0.115,<1",
  "huggingface-hub>=1.31.0",
  "insightface>=2.0",
  "opencv-python<5.0",
  "opencv-python-headless<5.0",
  "passporteye>=2.2.2",
  "pillow>=10,<12",
  "pyaadhaar>=2.0.2",
  "pyexiftool>=0.5.6",
  "python-multipart>=0.0.9,<1",
  "rapidocr-onnxruntime>=1.4.4",
  "retina-face>=0.0.18",
  "tf-keras>=2.21.0",
  "torch>=2.14.0",
  "torchvision>=0.29.0",
  "transformers>=5.17.0",
  "uvicorn[standard]>=0.30,<1",
  "zxing-cpp>=3.1.1",
]

[tool.uv]
package = false
